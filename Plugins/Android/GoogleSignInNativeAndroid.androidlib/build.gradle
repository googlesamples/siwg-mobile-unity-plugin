apply plugin: 'com.android.library'
kotlin {
    compilerOptions {
        freeCompilerArgs.add("-Xskip-metadata-version-check")
    }
}
android {
    namespace 'com.google.mobilesiwgunity'
    compileSdk getProperty("unity.compileSdkVersion") as int
    buildToolsVersion getProperty("unity.buildToolsVersion")
    defaultConfig {
        minSdk 23                                   // never above the host's own minSdk
        consumerProguardFiles 'consumer-rules.pro'  // keep rules travel with the module
    }
    compileOptions {
        sourceCompatibility JavaVersion.valueOf(getProperty("unity.javaCompatabilityVersion"))
        targetCompatibility JavaVersion.valueOf(getProperty("unity.javaCompatabilityVersion"))
    }
}
dependencies {
    // Unity engine classes (UnityPlayer) — provided by unityLibrary at runtime.
    compileOnly fileTree(dir: '../libs', include: ['*.jar'])
    // Compile-time only: the app gets these from GoogleSignInNativeDependencies.xml via EDM4U.
    // These are MINIMUM versions; consumers may resolve higher.
    compileOnly 'androidx.credentials:credentials:1.3.0'
    compileOnly 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}