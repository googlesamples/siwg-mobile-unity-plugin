apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.activity:activity-ktx:1.9.0' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:16
    implementation 'androidx.credentials:credentials:1.3.0' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:8
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:9
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:15
    implementation 'com.google.android.gms:play-services-auth:21.3.0' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:11
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:10
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:18
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1' // Assets/GoogleSignInNative/Editor/GoogleSignInDependencies.xml:14
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/armeabi-v7a/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
